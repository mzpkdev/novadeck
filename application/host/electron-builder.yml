appId: dev.mzpk.novadeck
productName: NovaDeck
asar: true
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: ../ui/dist
    to: ui
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  identity: null
  category: public.app-category.utilities
  target:
    - target: zip
      arch:
        - universal
win:
  target:
    - target: portable
      arch:
        - x64
linux:
  category: Utility
  maintainer: mzpkdev
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
