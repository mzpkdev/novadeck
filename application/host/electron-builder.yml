appId: dev.mzpk.novadeck
productName: novadeck.
executableName: novadeck
asar: true
# PTY libraries and their spawn helpers must run from the real filesystem.
asarUnpack:
  - node_modules/node-pty/**
# Rebuild production native dependencies for the target Electron version.
npmRebuild: true
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: ../ui/dist
    to: ui
artifactName: novadeck-${version}-${os}-${arch}.${ext}
mac:
  # Electron resolves helpers from CFBundleName; builder strips the branding's trailing dot.
  extendInfo:
    CFBundleName: novadeck
  identity: null
  category: public.app-category.utilities
  target:
    - target: zip
      arch:
        - universal
win:
  target:
    - target: portable
      arch:
        - x64
linux:
  category: Utility
  maintainer: mzpkdev
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
