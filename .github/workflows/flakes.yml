name: Known Flakes

# The known-flake register (scripts/flakes/register.json) against a failed run. A run whose
# every failure is a registered known flake gets one recorded rerun of its failed jobs;
# any other failure, a known flake failing again, or a flake registered as fixed coming
# back is left failed and reported for triage. It runs main's register and code, never a
# pull request's, so a change can't excuse its own failures. Release reruns only when it
# packaged a pull request, never when it published.
on:
  workflow_run:
    workflows: [Quality, E2E, Release]
    types: [completed]

permissions:
  contents: read

jobs:
  triage:
    name: Triage
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.name != 'Release' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To read the run's jobs and logs, and rerun its failed jobs.
      actions: write
      # To record the verdict on the pull request.
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26

      # The failed jobs of the run's latest attempt, one log each, named by job.
      - name: Fetch Failed Logs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' > "$RUNNER_TEMP/failed.tsv"
          while IFS=$'\t' read -r id name; do
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" > "$RUNNER_TEMP/logs/${name//\//-}.log"
          done < "$RUNNER_TEMP/failed.tsv"

      - name: Judge Failures
        shell: bash
        run: node scripts/flakes/main.ts "$RUNNER_TEMP/logs" "$RUNNER_TEMP/verdict.json" "$RUNNER_TEMP/comment.md"

      # The one rerun a run of known flakes gets; its next attempt, if it fails, is judged
      # again and left failed.
      - name: Rerun Failed Jobs
        shell: bash
        run: |
          if [ "$(jq -r .rerun "$RUNNER_TEMP/verdict.json")" = true ]; then
            gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
          fi

      # The verdict on each pull request the run is for. A fork's pull request gets a
      # read-only token, so its verdict stays in the job summary.
      - name: Record on Pull Request
        continue-on-error: true
        shell: bash
        env:
          PULL_REQUESTS: ${{ join(github.event.workflow_run.pull_requests.*.number, ' ') }}
        run: |
          for pr in $PULL_REQUESTS; do
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          done

      - name: Upload Verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: known-flakes-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            ${{ runner.temp }}/verdict.json
            ${{ runner.temp }}/logs/
          if-no-files-found: ignore
          retention-days: 30
