# Spike, not for main: does an AppArmor profile attached to the installed AppImage's path let
# Electron's sandbox start on Ubuntu with kernel.apparmor_restrict_unprivileged_userns=1?
# Each case launches the released AppImage for 15 seconds and records whether it stayed up,
# the AppArmor label of every Electron process, and whether its renderers run in their own
# user namespace, which is how Chromium's namespace sandbox shows itself.
name: AppArmor Spike

on:
  push:
    branches: [task/apparmor-spike]

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.90
    steps:
      - name: Prepare
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # libfuse2 so the v0.0.90 AppImage mounts; the FUSE question is the fuse3 task's.
          sudo apt-get install -y -q --no-install-recommends xvfb libfuse2t64 apparmor-utils
          echo "runner default: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          sudo aa-status --enabled && echo "AppArmor enabled"
          cat /proc/version

          image=novadeck-linux-x86_64.AppImage
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$image" -D "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/$image"
          # Where install.sh puts it, with its command, and where brew's cask would.
          mkdir -p ~/.local/share/novadeck ~/.local/bin ~/Applications
          cp "$RUNNER_TEMP/$image" ~/.local/share/novadeck/$image
          ln -sf ~/.local/share/novadeck/$image ~/.local/bin/novadeck
          cp "$RUNNER_TEMP/$image" ~/Applications/novadeck.AppImage

          mkdir -p "$RUNNER_TEMP/profiles"
          # The profile install.sh would write: both install paths, for every user's home.
          cat > "$RUNNER_TEMP/profiles/home" << 'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile novadeck @{HOME}/{.local/share/novadeck/novadeck-linux-x86_64,Applications/novadeck}.AppImage flags=(unconfined) {
            userns,
            include if exists <local/novadeck>
          }
          EOF
          # The Electron binary inside the mount instead, to learn which process needs it.
          cat > "$RUNNER_TEMP/profiles/mount" << 'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile novadeck-mount /tmp/.mount_novade*/novadeck flags=(unconfined) {
            userns,
          }
          EOF
          for profile in "$RUNNER_TEMP"/profiles/*; do
            sudo apparmor_parser --skip-kernel-load --debug "$profile" > /dev/null
          done

      - name: Probe
        run: |
          set +e -uo pipefail
          results="$RUNNER_TEMP/results.md"
          logs="$RUNNER_TEMP/logs"
          mkdir -p "$logs"
          printf '| Case | Restriction | Profile | Up after 15 s | Sandboxed renderers | Labels |\n|---|---|---|---|---|---|\n' > "$results"

          load() { sudo apparmor_parser --replace "$RUNNER_TEMP/profiles/$1"; }
          unload() {
            for name in home mount; do sudo apparmor_parser --remove "$RUNNER_TEMP/profiles/$name" 2> /dev/null || true; done
          }

          probe() {
            local name="$1" restrict="$2" profile="$3" executable="$4"
            unload
            [[ "$profile" != none ]] && load "$profile"
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns="$restrict"
            local data="$RUNNER_TEMP/data-$name" log="$logs/$name.log"
            NOVADECK_UPDATES=off setsid xvfb-run -a "$executable" --user-data-dir="$data" > "$log" 2>&1 &
            local leader=$!
            sleep 15

            local up=no sandboxed=no labels="" browser_ns="" renderer_ns=()
            kill -0 "$leader" 2> /dev/null && up=yes
            for pid in $(pgrep -f -- "--user-data-dir=$data"); do
              local args label ns
              args="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2> /dev/null)" || continue
              label="$(sudo cat "/proc/$pid/attr/current" 2> /dev/null | tr -d '\0')"
              ns="$(sudo readlink "/proc/$pid/ns/user" 2> /dev/null)"
              local type
              type="$(grep -oE -- '--type=[a-z-]+' <<< "$args" | head -1)"
              echo "$pid ${type:-browser} label=[$label] userns=$ns exe=$(sudo readlink /proc/$pid/exe)" >> "$log.processes"
              case "$type" in
                "") [[ "$args" == *"/tmp/.mount_"* ]] && browser_ns="$ns" ;;
                --type=renderer) renderer_ns+=("$ns") ;;
              esac
              labels+="${type:-browser}: ${label}<br>"
            done
            for ns in "${renderer_ns[@]}"; do
              [[ -n "$browser_ns" && "$ns" != "$browser_ns" ]] && sandboxed=yes
            done
            [[ ${#renderer_ns[@]} -eq 0 ]] && sandboxed="no renderer"
            printf '| %s | %s | %s | %s | %s | %s |\n' "$name" "$restrict" "$profile" "$up" "$sandboxed" "$(sort -u <<< "${labels//<br>/$'\n'}" | paste -sd ';')" >> "$results"

            kill -TERM -- "-$leader" 2> /dev/null
            sleep 3
            kill -KILL -- "-$leader" 2> /dev/null
            pkill -KILL -f -- "--user-data-dir=$data" 2> /dev/null
            sleep 2
            echo "::group::$name log"; tail -n 40 "$log"; cat "$log.processes" 2> /dev/null; echo "::endgroup::"
          }

          share=~/.local/share/novadeck/novadeck-linux-x86_64.AppImage
          probe baseline     0 none  "$share"
          probe restricted   1 none  "$share"
          probe home-command 1 home  ~/.local/bin/novadeck
          probe home-share   1 home  "$share"
          probe home-brew    1 home  ~/Applications/novadeck.AppImage
          probe mount-only   1 mount "$share"

          cat "$results" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -h -iE "sandbox|FATAL" "$logs"/*.log | sort | uniq -c | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Keep Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apparmor-spike-logs
          path: ${{ runner.temp }}/logs
