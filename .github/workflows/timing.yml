name: Benchmark Timing

# The timing run (architecture rule 16): the real app in the sandbox, timed. Real time on
# a shared machine makes its numbers too noisy to gate on, and it needs the relay's Rust
# build, so it runs nightly on main, as a trend, and on pull requests labelled `bench`,
# reported beside main's last run. It never fails on its numbers.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  timing:
    name: Timing run
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Main's last report, to show beside this one.
      actions: read
      pull-requests: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Toolchain
        id: toolchain
        continue-on-error: true
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # An immediate retry hit the same registry outage in the flake audit.
      - name: Wait Before Retrying Toolchain
        if: steps.toolchain.outcome == 'failure'
        shell: bash
        run: sleep 180

      - name: Set Up Toolchain Again
        if: steps.toolchain.outcome == 'failure'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # The Rust the relay's rust-toolchain.toml names, for the runner's build.
      - name: Set Up Rust
        shell: bash
        working-directory: application/relay
        run: rustup toolchain install

      - name: Cache Rust Builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            application/relay/target
          key: relay-${{ runner.os }}-${{ hashFiles('application/relay/Cargo.lock', 'application/relay/rust-toolchain.toml') }}

      - name: Locate Test Browser
        id: playwright
        shell: bash
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "version=$(pnpm --filter @novadeck/ui exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Test Browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Test Browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @novadeck/ui exec playwright install --with-deps chromium

      # A cached browser still needs its system libraries.
      - name: Install Test Browser Dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @novadeck/ui exec playwright install-deps chromium

      # Builds the runner and the sandbox, then times the app; it writes its report even
      # when the run stops short, saying why in the report.
      - name: Play Timing Run
        run: pnpm bench:timing --output "$RUNNER_TEMP/timing.json"

      # Main's last nightly report, if one is still kept.
      - name: Fetch Main's Report
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow timing.yml --branch main \
            --event schedule --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name timing --dir "$RUNNER_TEMP/main"
          fi

      - name: Report Timings
        shell: bash
        run: node scripts/benchmark/timing-main.ts "$RUNNER_TEMP/timing.json" "$RUNNER_TEMP/main/timing.json" "$RUNNER_TEMP/comment.md"

      # One comment per pull request, updated in place. A fork's pull request gets a
      # read-only token, so its numbers stay in the job summary.
      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          marker="<!-- novadeck-benchmark-timing -->"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F "body=@$RUNNER_TEMP/comment.md"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$RUNNER_TEMP/comment.md"
          fi

      # Each run's report, kept as the trend; main's nightly ones are what pull requests
      # compare with.
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timing
          path: ${{ runner.temp }}/timing.json
          if-no-files-found: ignore
          retention-days: 90
