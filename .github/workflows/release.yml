name: Release

run-name: Release latest main

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [release]

permissions:
  contents: read

concurrency:
  group: release-latest-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.plan.outputs.package || 'false' }}
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Capture Source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plan Release
        id: plan
        run: |
          version="$(pnpm exec release-it --release-version --no-github.release)"
          if [[ -z "$version" ]]; then
            echo "package=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "package=true"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }}
    if: needs.prepare.outputs.package == 'true'
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
            files: |
              release/*.AppImage
          - name: macOS
            os: macos-latest
            target: mac
            files: |
              release/*.zip
          - name: Windows
            os: windows-latest
            target: win
            files: |
              release/*.exe
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Set Package Version
        run: npm pkg set "version=${{ needs.prepare.outputs.version }}"

      - name: Package Application
        run: pnpm run package:${{ matrix.target }}

      - name: Smoke Test Linux Package
        if: matrix.target == 'linux'
        run: |
          artifact="$(realpath "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)")"
          test -n "$artifact"
          chmod +x "$artifact"

          unset APPDIR APPIMAGE
          set +e
          timeout --kill-after=5s 10s xvfb-run -a "$artifact" --appimage-extract-and-run
          status=$?
          set -e

          if [[ "$status" -ne 124 ]]; then
            echo "::error::The AppImage exited before the smoke-test interval (status $status)."
            exit 1
          fi

      - name: Smoke Test macOS Package
        if: matrix.target == 'mac'
        run: |
          artifact="$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$artifact"
          smoke_directory="$RUNNER_TEMP/novadeck-smoke"
          mkdir -p "$smoke_directory"
          ditto -x -k "$artifact" "$smoke_directory"
          executable="$smoke_directory/NovaDeck.app/Contents/MacOS/NovaDeck"
          test -x "$executable"

          "$executable" &
          pid=$!
          sleep 10

          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            echo "::error::The macOS application exited before the smoke-test interval."
            exit 1
          fi

          kill "$pid" 2>/dev/null || true
          wait "$pid" || true

      - name: Smoke Test Windows Package
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $artifact = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if ($null -eq $artifact) {
            throw "The portable executable was not found."
          }

          $process = Start-Process -FilePath $artifact.FullName -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()

          if ($process.HasExited) {
            throw "The portable executable exited before the smoke-test interval with status $($process.ExitCode)."
          }

          taskkill /PID $process.Id /T /F 2>$null | Out-Null

      - name: Upload Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NovaDeck-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish Dev Release
    if: needs.prepare.outputs.package == 'true'
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: NovaDeck-*
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish Dev Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec release-it "${{ needs.prepare.outputs.version }}" --ci
