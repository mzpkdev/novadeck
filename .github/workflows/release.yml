name: Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && 'Package current source' || 'Release latest main' }}

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [release]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_PATCH_ONLY: ${{ vars.RELEASE_PATCH_ONLY || 'true' }}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && format('package-{0}', github.run_id) || 'release-latest-main' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.automatic.outputs.package || steps.manual.outputs.package || 'false' }}
      previous_tag: ${{ steps.automatic.outputs.previous_tag }}
      publish: ${{ steps.automatic.outputs.publish || 'false' }}
      source_sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.automatic.outputs.tag }}
      version: ${{ steps.automatic.outputs.version || steps.manual.outputs.version }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Capture Source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plan Automatic Release
        id: automatic
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/release/plan/main.ts

      - name: Prepare Manual Package
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release/package/main.ts

  package:
    name: ${{ matrix.name }}
    if: needs.prepare.outputs.package == 'true'
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux*.yml
              release/*.blockmap
          - name: macOS
            os: macos-latest
            target: mac
            files: |
              release/*.dmg
              release/*.zip
              release/latest-mac*.yml
              release/*.blockmap
          - name: Windows
            os: windows-latest
            target: win
            files: |
              release/*.exe
              release/latest*.yml
              release/*.blockmap
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Set Package Version
        run: npm pkg set "version=${{ needs.prepare.outputs.version }}"

      - name: Package Application
        run: pnpm run package:${{ matrix.target }}

      - name: Upload Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NovaDeck-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish Dev Release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: NovaDeck-*
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Validate Release Target
        id: creation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists."
            exit 1
          fi
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          notes=(--generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            notes+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "$RELEASE_TAG" \
            --draft \
            --latest=false \
            --notes "Unsigned development build. macOS Gatekeeper and Windows SmartScreen may display warnings." \
            --target "$SOURCE_SHA" \
            --title "NovaDeck $RELEASE_TAG" \
            "${notes[@]}"

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/*

      - name: Publish GitHub Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest=false --prerelease

      - name: Remove Incomplete Release
        if: ${{ (failure() || cancelled()) && steps.creation.outputs.started == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          if release="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish 2>/dev/null)"; then
            is_draft="$(jq -r .isDraft <<< "$release")"
            target="$(jq -r .targetCommitish <<< "$release")"
            if [[ "$is_draft" == "true" && "$target" == "$SOURCE_SHA" ]]; then
              gh release delete "$RELEASE_TAG" --cleanup-tag --yes
            else
              echo "Refusing to remove a published release or a release for another commit."
            fi
          elif tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null)"; then
            if [[ "$tag_sha" == "$SOURCE_SHA" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
            else
              echo "Refusing to remove a tag for another commit."
            fi
          fi
