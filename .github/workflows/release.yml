name: Release

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      operation:
        description: Package the current source or promote an existing prerelease
        required: true
        default: package
        type: choice
        options:
          - package
          - promote
      tag:
        description: Existing vX.Y.Z prerelease to promote
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_PATCH_ONLY: ${{ vars.RELEASE_PATCH_ONLY || 'true' }}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'package' && format('package-{0}', github.run_id) ||
    github.event_name == 'workflow_dispatch' && 'promote-stable' || 'release-publish' }}
  queue: max

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.automatic.outputs.package || steps.manual.outputs.package || 'false' }}
      previous_tag: ${{ steps.automatic.outputs.previous_tag }}
      publish: ${{ steps.automatic.outputs.publish || 'false' }}
      tag: ${{ steps.automatic.outputs.tag }}
      version: ${{ steps.automatic.outputs.version || steps.manual.outputs.version }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.sha || github.sha }}

      - name: Validate Dispatched Source
        if: github.event_name == 'repository_dispatch'
        env:
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release dispatch must contain a full commit SHA."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "Checked-out commit does not match the release dispatch."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "$SOURCE_SHA is not on main."
            exit 1
          fi

      - name: Set Up Toolchain
        if: >-
          github.event_name == 'push' || github.event_name == 'repository_dispatch' ||
          inputs.operation == 'package'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Plan Automatic Release
        id: automatic
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
        run: node scripts/release/plan/main.ts

      - name: Prepare Manual Package
        id: manual
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'package'
        run: node scripts/release/package/main.ts

      - name: Validate Promotion Input
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Stable promotion must run from the main branch."
            exit 1
          fi
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "A vX.Y.Z prerelease tag is required for promotion."
            exit 1
          fi

  package:
    name: ${{ matrix.name }}
    if: needs.prepare.outputs.package == 'true'
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux*.yml
              release/*.blockmap
          - name: macOS
            os: macos-latest
            target: mac
            files: |
              release/*.dmg
              release/*.zip
              release/latest-mac*.yml
              release/*.blockmap
          - name: Windows
            os: windows-latest
            target: win
            files: |
              release/*.exe
              release/latest*.yml
              release/*.blockmap
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Set Package Version
        run: npm pkg set "version=${{ needs.prepare.outputs.version }}"

      - name: Package Application
        run: pnpm run package:${{ matrix.target }}

      - name: Upload Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NovaDeck-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish Dev Release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: NovaDeck-*
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Prepare GitHub Prerelease
        id: creation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists."
            exit 1
          fi
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ github.event.client_payload.sha || github.sha }}
        run: |
          notes=(--generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            notes+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "$RELEASE_TAG" \
            --draft \
            --latest=false \
            --notes "Unsigned development build. macOS Gatekeeper and Windows SmartScreen may display warnings." \
            --target "$SOURCE_SHA" \
            --title "NovaDeck $RELEASE_TAG" \
            "${notes[@]}"

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/*

      - name: Publish GitHub Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest=false --prerelease

      - name: Remove Incomplete Release
        if: ${{ (failure() || cancelled()) && steps.creation.outputs.started == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ github.event.client_payload.sha || github.sha }}
        run: |
          if release="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish 2>/dev/null)"; then
            is_draft="$(jq -r .isDraft <<< "$release")"
            target="$(jq -r .targetCommitish <<< "$release")"
            if [[ "$is_draft" == "true" && "$target" == "$SOURCE_SHA" ]]; then
              gh release delete "$RELEASE_TAG" --cleanup-tag --yes
            else
              echo "Refusing to remove a published release or a release for another commit."
            fi
          elif tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null)"; then
            if [[ "$tag_sha" == "$SOURCE_SHA" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
            else
              echo "Refusing to remove a tag for another commit."
            fi
          fi

  promote:
    name: Promote Stable Release
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Validate Stable Promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --json assets,isDraft,isPrerelease,tagName)"
          RELEASE_JSON="$release_json" \
            node scripts/release/promote/main.ts

          if ! git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main; then
            echo "$RELEASE_TAG does not point to a commit on main."
            exit 1
          fi

      - name: Verify Release Checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          cd release-assets

          while IFS= read -r -d '' asset; do
            checksum="$(sha256sum -- "$asset")"
            if ! grep --fixed-strings --line-regexp -- "$checksum" SHA256SUMS >/dev/null; then
              echo "$asset is missing a matching checksum."
              exit 1
            fi
          done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0')

          sha256sum --check --strict SHA256SUMS

      - name: Promote Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --latest --prerelease=false

      - name: Verify Stable Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          is_prerelease="$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)"
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$is_prerelease" != "false" || "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "Failed to verify $RELEASE_TAG as the latest stable release."
            exit 1
          fi
