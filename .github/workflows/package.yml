name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Release Tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs")

          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"))
          const expected = `v${manifest.version}`
          if (process.env.RELEASE_TAG !== expected) {
            console.error(`Release tag must be ${expected}, received ${process.env.RELEASE_TAG}.`)
            process.exitCode = 1
          }
          NODE

  package:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux*.yml
              release/*.blockmap
          - name: macOS
            os: macos-latest
            target: mac
            files: |
              release/*.dmg
              release/*.zip
              release/latest-mac*.yml
              release/*.blockmap
          - name: Windows
            os: windows-latest
            target: win
            files: |
              release/*.exe
              release/latest*.yml
              release/*.blockmap
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Package Application
        run: pnpm run package:${{ matrix.target }}

      - name: Upload Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NovaDeck-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Draft Release
    if: github.ref_type == 'tag'
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: NovaDeck-*
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published and will not be modified."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --draft \
              --generate-notes \
              --notes "Unsigned preview build. macOS Gatekeeper and Windows SmartScreen may display warnings." \
              --title "NovaDeck $RELEASE_TAG" \
              --verify-tag
          fi
