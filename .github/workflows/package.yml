name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Package the current source or promote an existing prerelease
        required: true
        default: package
        type: choice
        options:
          - package
          - promote
      tag:
        description: Existing vX.Y.Z prerelease to promote
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_PATCH_ONLY: ${{ vars.RELEASE_PATCH_ONLY || 'true' }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.automatic.outputs.package || steps.manual.outputs.package || 'false' }}
      previous_tag: ${{ steps.automatic.outputs.previous_tag }}
      publish: ${{ steps.automatic.outputs.publish || 'false' }}
      tag: ${{ steps.automatic.outputs.tag }}
      version: ${{ steps.automatic.outputs.version || steps.manual.outputs.version }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Up Toolchain
        if: github.event_name == 'push' || inputs.operation == 'package'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Plan Automatic Release
        id: automatic
        if: github.event_name == 'push'
        run: node scripts/release/plan/main.ts

      - name: Plan Packaging Run
        id: manual
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'package'
        run: node scripts/release/package/main.ts

      - name: Validate Promotion Input
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Stable promotion must run from the main branch."
            exit 1
          fi
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "A vX.Y.Z prerelease tag is required for promotion."
            exit 1
          fi

  package:
    name: ${{ matrix.name }}
    if: needs.prepare.outputs.package == 'true'
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux*.yml
              release/*.blockmap
          - name: macOS
            os: macos-latest
            target: mac
            files: |
              release/*.dmg
              release/*.zip
              release/latest-mac*.yml
              release/*.blockmap
          - name: Windows
            os: windows-latest
            target: win
            files: |
              release/*.exe
              release/latest*.yml
              release/*.blockmap
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Set Package Version
        run: npm pkg set "version=${{ needs.prepare.outputs.version }}"

      - name: Package Application
        run: pnpm run package:${{ matrix.target }}

      - name: Upload Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NovaDeck-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish Dev Release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: NovaDeck-*
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Publish GitHub Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          notes=(--generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            notes+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "$RELEASE_TAG" release-assets/* \
            --latest=false \
            --notes "Unsigned development build. macOS Gatekeeper and Windows SmartScreen may display warnings." \
            --prerelease \
            --target "$SOURCE_SHA" \
            --title "NovaDeck $RELEASE_TAG" \
            "${notes[@]}"

  promote:
    name: Promote Stable Release
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Validate Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --json assets,isDraft,isPrerelease,tagName)"
          if latest_stable_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null)"; then
            :
          else
            latest_stable_tag=""
          fi

          RELEASE_JSON="$release_json" \
            LATEST_STABLE_TAG="$latest_stable_tag" \
            node scripts/release/promote/main.ts

          if ! git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main; then
            echo "$RELEASE_TAG does not point to a commit on main."
            exit 1
          fi

      - name: Promote Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --latest --prerelease=false

      - name: Verify Stable Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          is_prerelease="$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)"
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$is_prerelease" != "false" || "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "Failed to verify $RELEASE_TAG as the latest stable release."
            exit 1
          fi
