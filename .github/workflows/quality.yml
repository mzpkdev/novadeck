name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.browser && 15 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            os: ubuntu-latest
            command: npm run format:check
          - name: Lint
            os: ubuntu-latest
            command: npm run lint
          - name: Typecheck
            os: ubuntu-latest
            command: npm run typecheck
          - name: Test (Linux)
            os: ubuntu-latest
            browser: true
            command: npm run test
          - name: Test (macOS)
            os: macos-latest
            browser: true
            command: npm run test
          - name: Test (Windows)
            os: windows-latest
            browser: true
            command: npm run test
          - name: Build
            os: ubuntu-latest
            command: npm run build
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Install Test Browser
        if: matrix.browser
        run: pnpm --filter @novadeck/ui exec playwright install --with-deps chromium

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  # PROBE (temporary): Windows runner-suite repetitions, bundled vs system ConPTY.
  conpty-probe:
    name: ConPTY probe (${{ matrix.conpty }})
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        conpty: [bundled, system]
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Build Runner
        run: pnpm exec turbo run build --filter=@novadeck/runner

      - name: Repeat Runner Tests
        shell: bash
        working-directory: application/runner
        env:
          NOVADECK_PTY_TIMING: "1"
          NOVADECK_CONPTY_DLL: ${{ matrix.conpty == 'system' && '0' || '1' }}
        run: |
          for round in 1 2 3 4; do
            echo "::group::round $round"
            npx vitest run 2>&1 | tee "round-$round.log" | grep -E "Tests |FAIL |PROBE|timed out" || true
            echo "::endgroup::"
          done
          echo "== summary ($NOVADECK_CONPTY_DLL)"
          for round in 1 2 3 4; do
            echo "round $round: $(grep -E 'Tests ' round-$round.log | tail -1) | slow kills: $(grep -c 'PROBE kill blocked' round-$round.log)"
          done
          grep -h "PROBE kill blocked" round-*.log | sort | uniq -c | sort -rn | head -20 || true

  test:
    name: Test
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require All Quality Checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
