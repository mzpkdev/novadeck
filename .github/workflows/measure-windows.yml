name: Measure Windows (throwaway)

# Temporary: measures what an agent's MCP server costs on Windows when started through
# cmd and mcp.cmd, as plugins start it today, against the relay started directly.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/measure-windows.yml

permissions:
  contents: read

jobs:
  measure:
    name: Measure
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Build the Relay
        shell: bash
        env:
          NOVADECK_RELAY_FROM_SOURCE: "1"
        run: |
          (cd application/relay && rustup toolchain install)
          node application/relay/scripts/build.ts

      - name: Measure
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/measure.mjs" <<'SCRIPT'
          import { spawn, execFileSync } from "node:child_process"
          import { writeFileSync, appendFileSync } from "node:fs"
          import { join, resolve } from "node:path"

          const relay = resolve("application/relay/dist/novadeck-relay.exe")
          const launcher = join(process.env.RUNNER_TEMP, "mcp.cmd")
          writeFileSync(launcher, `@echo off\r\n"${relay}" mcp 1.2.0 2025-11-25 2025-06-18 %*\r\n`)
          const env = { ...process.env }
          for (const name of ["NOVADECK_TERMINAL_ID", "NOVADECK_REPORT", "NOVADECK_REPORT_TOKEN"]) delete env[name]

          // Every process under `pid`, with its private bytes and working set.
          const tree = (pid) => {
            const json = execFileSync("powershell.exe", ["-NoProfile", "-Command",
              "Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,Name,PrivatePageCount,WorkingSetSize | ConvertTo-Json -Compress"],
              { encoding: "utf8", maxBuffer: 64 << 20 })
            const all = JSON.parse(json)
            const found = []
            const walk = (id) => {
              for (const each of all) if (each.ParentProcessId === id) { found.push(each); walk(each.ProcessId) }
            }
            const self = all.find((each) => each.ProcessId === pid)
            if (self) found.push(self)
            walk(pid)
            return found
          }

          const measure = async (label, command, args, windowsHide) => {
            const child = spawn(command, args, { env, stdio: ["pipe", "pipe", "inherit"], windowsHide })
            let out = ""
            child.stdout.on("data", (chunk) => (out += chunk))
            child.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 1, method: "initialize", params: { protocolVersion: "2025-06-18" } }) + "\n")
            const began = Date.now()
            while (!out.includes('"id":1') && Date.now() - began < 10_000) await new Promise((r) => setTimeout(r, 50))
            await new Promise((r) => setTimeout(r, 1500))
            const processes = tree(child.pid)
            child.stdin.end()
            await new Promise((r) => child.on("exit", r))
            const kb = (bytes) => Math.round(Number(bytes) / 1024)
            const rows = processes.map((p) => `| ${label} | ${p.Name} | ${kb(p.PrivatePageCount)} | ${kb(p.WorkingSetSize)} |`)
            const total = processes.reduce((sum, p) => sum + Number(p.PrivatePageCount), 0)
            rows.push(`| ${label} | **total (${processes.length} processes)** | **${kb(total)}** | |`)
            const answered = out.includes('"protocolVersion":"2025-06-18"')
            rows.push(`| ${label} | handshake answered | ${answered} | |`)
            return rows
          }

          const lines = ["| Start | Process | Private KB | Working set KB |", "| --- | --- | --- | --- |"]
          for (const hide of [true, false]) {
            const how = hide ? "hidden" : "visible"
            lines.push(...(await measure(`cmd → mcp.cmd (${how})`, process.env.COMSPEC || "cmd.exe", ["/d", "/c", launcher], hide)))
            lines.push(...(await measure(`relay directly (${how})`, relay, ["mcp", "1.2.0", "2025-11-25", "2025-06-18"], hide)))
          }
          console.log(lines.join("\n"))
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n")
          SCRIPT
          node "$RUNNER_TEMP/measure.mjs"
