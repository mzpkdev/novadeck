name: Try

# The visitor build (`pnpm build:try`) on GitHub Pages, at try.novadeck.dev: every push to
# main deploys it, so the demo follows main, at times ahead of the latest release. Quality's
# "Build (try)" builds it on every pull request first.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a newer push waits for the one in flight rather than cutting
# it off midway.
concurrency:
  group: try-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Visitor Demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm is downloaded from the npm registry with a 30 s bound, which a slow runner
      # misses now and then (seen on Windows CI); a second try follows a failed first.
      - name: Set Up Toolchain
        id: toolchain
        continue-on-error: true
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Set Up Toolchain Again
        if: steps.toolchain.outcome == 'failure'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm build:try

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: application/ui/dist-try

  deploy:
    name: Deploy Visitor Demo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
