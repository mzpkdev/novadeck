name: Issue
description: Report a bug or propose a change.
body:
  - type: markdown
    attributes:
      value: Read CONTRIBUTING.md first. Keep secrets out of this issue.

  - type: textarea
    id: what
    attributes:
      label: What
      description: What happened or should change? Include any constraints.
      placeholder: Describe the problem or goal.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why does this matter?
      placeholder: Describe the impact.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: For bugs, include steps to reproduce, expected and actual results, and relevant environment details. Add sanitized evidence when useful.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What observable result would resolve this request?
      placeholder: List outcomes that can be checked.
