packages:
  - application/*

publicHoistPattern:
  - electron

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: false
  node-pty: true
minimumReleaseAgeExclude:
  - "@types/node@26.6.2"
  - "@tanstack/query-core@5.104.0"
  - "@tanstack/react-query@5.104.0"

patchedDependencies:
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
